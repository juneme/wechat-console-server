name: Release

on:
  push:
    branches:
      - main
    paths:
      - "app/__init__.py"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve release version
        id: version
        run: |
          version="$(python -c "from app import __version__; print(__version__)")"
          python -c "import re, sys; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', sys.argv[1]), f'invalid version: {sys.argv[1]!r}'" "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "asset=wechat-console-server-v${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Decide whether this version needs a release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match application version $RELEASE_TAG" >&2
              exit 1
            fi
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [[ -z "$remote_commit" || "$remote_commit" == "$GITHUB_SHA" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET_NAME"; then
            echo "Release $RELEASE_TAG already has $ASSET_NAME; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $RELEASE_TAG exists at another commit but its release asset is missing." >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.release_state.outputs.needed == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and test
        if: steps.release_state.outputs.needed == 'true'
        run: |
          python -m ruff check .
          python -m pytest -q
          node --check app/static/app.js
          bash -n install.sh show-client-config.sh rotate-api-keys.sh

      - name: Build and verify release archive
        if: steps.release_state.outputs.needed == 'true'
        env:
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          python scripts/build_release.py --output "artifacts/${ASSET_NAME}"
          python scripts/build_release.py --verify-only "artifacts/${ASSET_NAME}"

      - name: Create version tag when releasing from main
        if: steps.release_state.outputs.needed == 'true' && github.ref_type != 'tag'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create release and upload archive
        if: steps.release_state.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Yunoe Console ${RELEASE_TAG}"
          fi
          gh release upload "$RELEASE_TAG" "artifacts/${ASSET_NAME}" --clobber
